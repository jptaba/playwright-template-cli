# =============================================================================
#  Playwright E2E Automation — GitLab CI reference pipeline
# =============================================================================
#  STATUS: every npm script referenced below exists and runs. What has not been
#  executed is this file itself — no GitLab instance, runner or credential has
#  been available, so the pipeline shape is unverified even though its contents
#  are not.
#
#  This file encodes the decisions in docs/plan.html. It is written to be read
#  as documentation as much as run, so it is more heavily commented than a
#  working pipeline would be. Section references (§n) point at the plan.
#
#  Before this runs for real, do these four things:
#    1. Pin PW_VERSION to the version in package.json and keep them in lockstep.
#    2. Have a Vault admin enable the JWT auth backend + role (§13). Nothing
#       secret-dependent works until that exists.
#    3. Replace every <placeholder> below. None of them are guessable.
#    4. Confirm GitLab Pages is enabled, or switch the report link to a job
#       artifact URL (§13).
#
#  When it does go live, split this into ci/*.yml behind `include:` — a single
#  file is easier to read as reference, harder to maintain as infrastructure.
# =============================================================================

spec:
  inputs:
    environment:
      default: staging
      description: Target environment for the suite.
    shards:
      default: 4
      type: number
      description: Parallel shard count. Must not exceed the account pool size
                   for any single role, or the suite serialises on leases (§10).
---

# -----------------------------------------------------------------------------
#  Global
# -----------------------------------------------------------------------------

variables:
  PW_VERSION: "1.62.1"                      # keep identical to package.json
  NODE_ENV: test
  TARGET_ENV: $[[ inputs.environment ]]
  SHARD_TOTAL: $[[ inputs.shards ]]

  # Playwright writes browsers into the project so the cache below can hold them.
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"

  # --- Restricted network (§14) ------------------------------------------------
  # Set these as masked CI/CD variables at group level, not here.
  #   HTTP_PROXY / HTTPS_PROXY / NO_PROXY
  #   NODE_EXTRA_CA_CERTS   -> path to the internal root CA bundle
  #   PLAYWRIGHT_DOWNLOAD_HOST -> internal mirror for browser binaries
  # NEVER set NODE_TLS_REJECT_UNAUTHORIZED=0 to work around certificate errors.
  # It disables validation process-wide, including the Vault calls carrying
  # credentials, and it survives into places you did not intend (§14).
  GIT_DEPTH: "20"

default:
  image: mcr.microsoft.com/playwright:v${PW_VERSION}-noble
  interruptible: true
  tags:
    # Project-specific runners, not shared. On a shared runner, secrets pulled
    # into the job environment are exposed to whatever else executes there (§13).
    - <project-specific-runner-tag>
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      # Deliberately NOT script_failure. Test flakiness is handled by
      # Playwright's own retries so that `test.outcome()` can report it as
      # flaky (§15). Retrying the job would hide it entirely.

stages:
  - verify
  - test
  - merge
  - triage
  - publish
  - maintenance

# -----------------------------------------------------------------------------
#  Reusable fragments
# -----------------------------------------------------------------------------

.node-cache: &node-cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - .cache/ms-playwright/
  policy: pull

.install:
  before_script:
    - npm ci --cache .npm --prefer-offline
    # The Playwright image already ships matching browsers; this is a no-op
    # when the image and PW_VERSION agree, and a loud failure when they drift.
    - npx playwright install --with-deps chromium

# --- Vault authentication (§13) ----------------------------------------------
# GitLab mints a signed JWT per job; Vault validates it and returns secrets.
# There is no secret_id to distribute, wrap or rotate — the bootstrap
# credential problem disappears.
#
# Vault side must exist first (separate team, separate request):
#   vault auth enable jwt
#   vault write auth/jwt/config oidc_discovery_url="https://<gitlab-host>"
#     -> requires network reachability Vault -> GitLab.
#     -> if that path cannot be opened, use jwt_validation_pubkeys instead,
#        accepting that GitLab signing-key rotation then breaks CI until
#        someone updates Vault by hand (§13).
#   vault write auth/jwt/role/playwright-e2e \
#     bound_claims='{"project_path":"<group>/<project>","ref_protected":"true"}'
#
# bound_claims are the real win over AppRole: a job on an unprotected branch
# of a fork cannot read staging credentials even holding a valid token.
.vault-auth:
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://<vault-host>
  variables:
    VAULT_SERVER_URL: https://<vault-host>
    VAULT_AUTH_PATH: jwt
    VAULT_AUTH_ROLE: playwright-e2e
    VAULT_NAMESPACE: <namespace-if-enterprise>   # omit on OSS Vault
  secrets:
    PRACTITEST_TOKEN:
      vault: qa/shared/integrations/practitest/token@kv
      file: false
    JIRA_PAT:
      vault: qa/shared/integrations/jira/pat@kv
      file: false
    SMTP_PASSWORD:
      vault: qa/shared/integrations/smtp/password@kv
      file: false
    # Account-pool credentials are NOT pulled here. They are leased at runtime
    # by the worker-scoped fixture so that leasing stays atomic and TTL'd (§10).

# -----------------------------------------------------------------------------
#  verify — every merge request
# -----------------------------------------------------------------------------

verify:
  stage: verify
  extends: .install
  cache:
    <<: *node-cache
    policy: pull-push
  script:
    - npm run lint          # executable conventions — the agent's feedback loop (§5)
    - npx tsc --noEmit
    # These three guard the AI contract. Each fails the build on drift, which is
    # the point: a stale catalog or instruction file degrades generation silently.
    - npm run catalog:check       # generated capability catalog is current
    - npm run instructions:check  # CLAUDE.md / copilot-instructions.md in sync
    - npm run agents:check        # playwright agent definitions match PW_VERSION
    # Both traceability hops: an edited story surfaces as "3 cases derived from
    # FIN-2210 are stale", an edited case as "the spec tests a previous
    # version" (§9). Silent drift becomes a visible task.
    - npm run hashes:check
    # The specificity gate over every committed case (§7). Expect it to reject
    # a share of a legacy suite on first run — that is the system working.
    - npm run cases:gate
    # The framework's own tests: lint rules, adapters, reporters, triage.
    - npm run test:unit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -----------------------------------------------------------------------------
#  test — smoke on MRs, full suite nightly
# -----------------------------------------------------------------------------

.playwright-test:
  stage: test
  extends: .install
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - blob-report/
    reports:
      # Puts pass/fail directly on the MR widget. One line, best feedback
      # surface available (§13).
      junit: results/junit.xml
    exclude:
      # storageState files hold live session tokens — anyone with the file is
      # signed in as that account, no password or MFA needed (§10). They must
      # never leave the job.
      - .auth/**

test:smoke:
  extends: .playwright-test
  variables:
    TARGET_ENV: staging
  script:
    - npx playwright test --grep @smoke --reporter=blob,junit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:full:
  extends:
    - .playwright-test
    - .vault-auth
  parallel:
    matrix:
      - SHARD: [1, 2, 3, 4]
  script:
    - npx playwright test
        --shard=$SHARD/$SHARD_TOTAL
        --reporter=blob,junit
  rules:
    # Scheduled only. A full suite on every push exhausts the account pool and
    # the PractiTest rate limit simultaneously.
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "nightly"
    - if: $CI_PIPELINE_SOURCE == "web"      # manual run from the UI

# -----------------------------------------------------------------------------
#  merge — one job, and that is deliberate
# -----------------------------------------------------------------------------
#  Merging shards into a single result set is required twice over:
#    - PractiTest allows 30 API calls/min and 20 instances per run POST (§11).
#      N shards each posting independently blows that on the first real night.
#    - Flaky status is only knowable once every attempt across every shard is
#      accounted for (§15).
#  The two constraints happen to want the same architecture.

merge:
  stage: merge
  extends: .install
  needs: ["test:full"]
  script:
    - npx playwright merge-reports --reporter=html,json ./blob-report
    # Normalise into the canonical model every downstream consumer reads.
    # Nothing else re-derives facts from raw Playwright output (§15).
    # Each shard uploads its own run-result-<n>.json; this merges them, which
    # is also the only point at which flaky status is knowable.
    - npm run report:normalise -- results   # -> run-result.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - playwright-report/
      - run-result.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "nightly"
      when: always                # must run even when tests failed
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always

# -----------------------------------------------------------------------------
#  triage — cluster, then rules, then the model (§17)
# -----------------------------------------------------------------------------
#  Order matters and is the whole design. Clustering first means forty tests
#  failing on one environment incident are triaged once, not forty times: it
#  avoids forty defects, cuts cost by the clustering factor, and is MORE
#  accurate, because breadth is itself the evidence for an infrastructure cause.
#  Rule-based classification then resolves everything deterministic (passed on
#  retry => flaky by definition; 5xx in the network log => never a locator).
#  Only the genuine judgement calls reach the model.

triage:
  stage: triage
  extends: .install
  needs: ["merge"]
  variables:
    JIRA_AUTOFILE: "false"       # keep off until agreement rate is measured
    # The model stays off until clustering + rules have been measured alone,
    # and until the data-handling terms are reviewed — traces carry
    # application data (§14, §17).
    TRIAGE_AGENT_ENABLED: "false"
  script:
    - npm run triage:cluster     # group by normalised error + step + time window
    - npm run triage:rules       # deterministic classification
    - npm run triage:agent       # model, on the remainder only
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - triage-result.json
  allow_failure: true            # advisory. Never blocks reporting.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "nightly"
      when: on_failure           # only when something actually failed
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_failure

# -----------------------------------------------------------------------------
#  publish
# -----------------------------------------------------------------------------

pages:
  stage: publish
  needs: ["merge"]
  script:
    - npm run report:render      # bespoke stakeholder report -> report-out/index.html
    - mkdir -p public
    - cp -r playwright-report/* public/
    - cp report-out/index.html public/index.html
    # The trend band needs history, and CI artifacts expire. report:render
    # appends this run's summary to a committed JSON-lines file — commit it
    # back on a schedule, or point HISTORY at an object store (§19).
    - test -f docs/generated/run-history.jsonl && cp docs/generated/run-history.jsonl public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "nightly"
      when: always
  # If Pages is disabled on a self-managed instance, drop this job and link the
  # merge job's artifact URL from the email instead. The email design needs a
  # stable link either way — an .html attachment will be quarantined (§16).

publish:results:
  stage: publish
  extends:
    - .install
    - .vault-auth
  needs: ["merge", "triage"]
  script:
    # Batched <=20 instances per POST, throttled under 30 calls/min, with
    # backoff on 429. Attachments only on failure, scrubbed first (§11).
    - npm run publish:practitest
    # Off by default. An automated filer pointed at a broken environment can
    # create hundreds of tickets overnight (§12).
    - if [ "$JIRA_AUTOFILE" = "true" ]; then npm run publish:jira; fi
  allow_failure: true            # reporting never turns a green suite red
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "nightly"
      when: always

notify:email:
  stage: publish
  extends:
    - .install
    - .vault-auth
  needs: ["merge", "triage", "pages"]
  variables:
    # Subject carries the verdict so it is triageable from a lock screen:
    #   [FAIL] Regression · staging · 12 failed, 4 flaky · build 4821
    REPORT_URL: "$CI_PAGES_URL"
  script:
    # Outlook-safe digest: table layout, inlined CSS, no JS, plain-text
    # alternative part. Inline images as CID attachments — base64 data URIs
    # are stripped by Gmail and blocked outright by Outlook (§16).
    - npm run notify:email
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "nightly"
      when: always

# -----------------------------------------------------------------------------
#  maintenance
# -----------------------------------------------------------------------------

rotate:passwords:
  stage: maintenance
  extends:
    - .install
    - .vault-auth
  # Its own schedule, with SCHEDULE_TYPE=rotation. Deliberately never in the
  # nightly pipeline: rotating an account mid-run produces authentication
  # failures that look exactly like application defects (§10).
  #
  # Order of operations is what makes this safe:
  #   lease exclusively -> change in app -> VERIFY by logging in ->
  #   write new KV v2 version -> invalidate storageState -> release.
  # Vault-first would leave an account nobody can use and a credential store
  # that lies about it. On any failure: quarantine, alert, do not retry blindly.
  script:
    - npm run rotate:passwords
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "rotation"
  # Blackout window and jitter are enforced in the script, not here, so a
  # manually triggered run cannot bypass them.

heal:
  stage: maintenance
  extends: .install
  # Manual only, and it opens a merge request — it never pushes to a protected
  # branch. Locator and timing repairs only; a changed assertion is escalated,
  # never healed. A healer that "fixes" a test to match newly-broken behaviour
  # destroys the reason the test existed (§7).
  script:
    - npm run heal -- --open-mr
  when: manual
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "nightly"
    - if: $CI_PIPELINE_SOURCE == "web"
